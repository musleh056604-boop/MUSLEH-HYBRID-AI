name: llama-server-arm64
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      llama_tag:
        description: llama.cpp tag or branch
        required: false
        default: master
        type: string
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Clone llama.cpp
        run: git clone --depth 1 --branch "${{ inputs.llama_tag || 'master' }}" https://github.com/ggml-org/llama.cpp src
      - name: Locate NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          [ -d "$NDK" ] || NDK="$(ls -d "$ANDROID_SDK_ROOT"/ndk/* | sort -V | tail -1)"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
      - name: Build Android ARM64 server
        run: |
          cmake -S src -B build -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_LLAMAFILE=OFF -DLLAMA_CURL=OFF -DBUILD_SHARED_LIBS=OFF -DCMAKE_C_FLAGS=-march=armv8-a -DCMAKE_CXX_FLAGS=-march=armv8-a
          cmake --build build --target llama-server -j2
      - name: Package and verify
        run: |
          cp build/bin/llama-server libllama_server.so
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" libllama_server.so
          readelf -h libllama_server.so | grep -q AArch64
          sha256sum libllama_server.so
      - uses: actions/upload-artifact@v4
        with:
          name: llama-server-arm64
          path: libllama_server.so
