name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [musleh-v1-core]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
      - name: Flutter dependencies
        working-directory: app
        run: flutter pub get
      - name: Build bundled arm64 runtime
        run: bash runtime/build-runtime.sh arm64-v8a
      - name: Verify bundled runtime
        run: python3 tooling/check_runtime_bundle.py arm64
      - name: Skip optional tawcroot failure
        run: sed -i 's/\[\[ \$mode == release \]\] && die "tawcroot: libtawcroot.so did not build"/echo "tawcroot unavailable; continuing"/g' tooling/build-apk.sh
      - name: Build arm64 APK
        run: bash tooling/build-apk.sh --build-name 1.0.0 --no-companion
      - uses: actions/upload-artifact@v4
        with:
          name: musleh-arm64-runtime-apk
          path: app/build/app/outputs/**/*.apk
